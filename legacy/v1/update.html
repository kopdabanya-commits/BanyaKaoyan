<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#f8f9fb" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="板牙考研：一个考研复习App，英语二与政治共用界面、各自独立计划和学习记录，支持离线使用。" />
  
  
  <link rel="stylesheet" href="./styles.css?reauth=1"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png" type="image/png">
  <title>板牙考研 · 更新入口</title>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="logo"><span class="logo-mark" aria-hidden="true"></span><span>板牙考研</span></div><div class="top-date" id="system-date"></div></header>
    <main id="app"></main>
  </div>
  <nav class="bottom-nav" aria-label="主要页面">
    <button data-view="today" class="nav-tab active" aria-current="page"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>今日</span></button>
    <button data-view="calendar" class="nav-tab"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></svg><span>日历</span></button>
    <button data-view="stats" class="nav-tab"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11m5 9V5m5 15v-7m5 7V9" stroke-linecap="round"/><path d="M2 21h20"/></svg><span>统计</span></button>
    <button data-view="assistant" class="nav-tab"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6 4V6a2 2 0 0 1 2-2z"/><path d="M8 9h8M8 13h5"/></svg><span>助手</span></button>
    <button data-view="settings" class="nav-tab"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.2 2.8 9.8 5a7 7 0 0 0-1.9 1.1L5.8 5.4 3.6 9.2l1.8 1.4a8 8 0 0 0 0 2.8l-1.8 1.4 2.2 3.8 2.1-.7a7 7 0 0 0 1.9 1.1l.4 2.2h4.4l.4-2.2a7 7 0 0 0 1.9-1.1l2.1.7 2.2-3.8-1.8-1.4a8 8 0 0 0 0-2.8l1.8-1.4-2.2-3.8-2.1.7A7 7 0 0 0 15 5l-.4-2.2z"/><circle cx="12.4" cy="12" r="2.5"/></svg><span>设置</span></button>
  </nav>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="编辑任务"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="./planner-core.js?reauth=1"></script>
  <script src="./plan-data.js?reauth=1"></script>
  <script src="./study-intelligence.js?reauth=1"></script>
  <script src="./politics-core.js?reauth=1"></script>
  <script src="./politics-plan-data.js?reauth=1"></script>
  <script src="./study-ui.js?reauth=1"></script>
  <script src="./politics-ui.js?reauth=1"></script>
  <script src="./plan-import.js?reauth=1"></script>
  <script src="./cloud-sync.js?reauth=1"></script>
  <script src="./study-assistant.js?reauth=1"></script>
  <script src="./learning-diagnostics.js?reauth=1"></script>
  <script src="./origin-transfer.js?reauth=1"></script>
  <script src="./app.js?reauth=1"></script>
</body>
</html>
