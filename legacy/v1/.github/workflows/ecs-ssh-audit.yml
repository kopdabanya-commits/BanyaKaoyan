name: ECS authorized read-only audit
# Final read-only inventory after authorized NJFU retirement.

on:
  push:
    branches: [feat/huawei-ecs-cloud-sync-m29]
    paths: [.github/workflows/ecs-ssh-audit.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      BANYA_SSH_PASSWORD: ${{ secrets.BANYA_ECS_SSH_PASSWORD }}
      BANYA_SSH_USER: ${{ vars.BANYA_ECS_SSH_USER || 'root' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether SSH authorization is configured
        id: credential
        run: |
          if [ -n "$BANYA_SSH_PASSWORD" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'BANYA_ECS_SSH_PASSWORD is not configured; no login attempted.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Read server capacity and service state
        if: steps.credential.outputs.ready == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass
          test -s server/banya-sync/known_hosts
          umask 077
          export SSHPASS="$BANYA_SSH_PASSWORD"
          set +e
          sshpass -e ssh -p 22 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/server/banya-sync/known_hosts" \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            -o ConnectTimeout=12 \
            "$BANYA_SSH_USER@124.70.128.201" \
            'bash -s' < server/banya-sync/audit-ecs.sh \
            > /tmp/banya-ecs-audit-output 2> /tmp/banya-ecs-audit-error
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo 'SSH authenticated; private inventory was checked without publication.' >> "$GITHUB_STEP_SUMMARY"
          elif grep -qi 'Permission denied\|Authentication failed' /tmp/banya-ecs-audit-error; then
            echo 'SSH responded, but authentication failed.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          elif grep -qi 'Host key verification failed\|REMOTE HOST IDENTIFICATION HAS CHANGED' /tmp/banya-ecs-audit-error; then
            echo 'Pinned host key mismatch; stopped connection.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo 'SSH audit failed; inspect the private runner output locally.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
