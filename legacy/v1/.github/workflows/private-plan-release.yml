name: Reviewed private-plan channel upgrade
on:
  workflow_dispatch:
    inputs:
      preserve_ai_config:
        type: boolean
        default: false
        description: Explicit maintenance of already approved AI settings; rejects in-flight calls
permissions:
  contents: read
concurrency:
  group: banya-ecs-production
  cancel-in-progress: false
jobs:
  upgrade:
    if: github.ref == 'refs/heads/main'
    environment: banya-ai-production
    runs-on: ubuntu-latest
    env:
      BANYA_SSH_PASSWORD: ${{ secrets.BANYA_ECS_SSH_PASSWORD }}
      BANYA_SSH_USER: ${{ vars.BANYA_ECS_SSH_USER || 'root' }}
      PRESERVE_AI_CONFIG: ${{ inputs.preserve_ai_config }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the reviewed channel before touching ECS
        run: |
          set -euo pipefail
          python -m pip install -r server/banya-sync/requirements.txt pytest==9.0.2 httpx==0.28.1
          python -m pytest -q server/banya-sync/test_*.py
          bash -n server/banya-sync/upgrade-private-plan.sh
          test -n "$BANYA_SSH_PASSWORD"
          test -s server/banya-sync/known_hosts
      - name: Reuse authorized SSH and perform a backup-first upgrade
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass
          export SSHPASS="$BANYA_SSH_PASSWORD"
          ssh_opts=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/server/banya-sync/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15)
          remote="$BANYA_SSH_USER@124.70.128.201"
          sshpass -e ssh "${ssh_opts[@]}" "$remote" 'install -d -m 0700 /root/banya-agent-stage'
          tar -C server/banya-sync -cf - app.py backup_db.py autonomous.py agent_api.py deepseek_ai.py learning_memory.py learning_policy.py learning_analysis.py learning_planner.py context_engine.py capabilities.py private_plan.py realloc.py agent-openapi.json upgrade_guard.py upgrade-private-plan.sh |
            sshpass -e ssh "${ssh_opts[@]}" "$remote" 'tar -C /root/banya-agent-stage -xf -'
          ai_policy=disable
          if [[ "$PRESERVE_AI_CONFIG" == true ]]; then ai_policy=preserve-approved; fi
          sshpass -e ssh "${ssh_opts[@]}" "$remote" "bash /root/banya-agent-stage/upgrade-private-plan.sh $GITHUB_SHA $ai_policy"
      - name: Verify public schema and denied unauthenticated access without reading snapshots
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          base = 'https://124.70.128.201'
          with urllib.request.urlopen(base + '/v1/agent/openapi.json', timeout=20) as response:
              schema = json.load(response)
          assert len(schema['paths']) == 5
          assert schema['paths']['/v1/agent/changes/{change_id}/commit']['post']['x-openai-isConsequential']
          for path in ('/v1/agent/capabilities', '/v1/agent/grants', '/v1/agent/plans/english?start=2026-10-16&end=2026-10-16', '/v1/agent/changes/unauthorized-probe', '/v1/snapshot/english', '/v1/snapshot/politics', '/v1/ai/status', '/v1/ai/profiles/english', '/v1/ai/profiles/politics', '/v1/ai/auto/status'):
              try:
                  urllib.request.urlopen(base + path, timeout=20)
                  raise AssertionError('Unauthorized access unexpectedly succeeded')
              except urllib.error.HTTPError as error:
                  assert error.code == 401
          probes = {
              '/v1/agent/grants': {},
              '/v1/agent/plans/english/preview': {'expectedRevision': 1, 'templateVersion': 'unauthorized-probe', 'requestId': 'unauthorized-probe', 'tasks': [{'operation': 'update', 'taskId': 'unauthorized-probe', 'minutes': 1}]},
              '/v1/agent/changes/unauthorized-probe/commit': {'expectedRevision': 1, 'confirmation': 'sync'},
          }
          for path, payload in probes.items():
              request = urllib.request.Request(base + path, data=json.dumps(payload).encode(), headers={'Content-Type': 'application/json'}, method='POST')
              try:
                  urllib.request.urlopen(request, timeout=20)
                  raise AssertionError('Unauthorized write unexpectedly succeeded')
              except urllib.error.HTTPError as error:
                  assert error.code == 401
          print('TLS, public schema and unauthorized 401 verified. No private record was requested with credentials.')
          PY
      - name: Read-only production mobile smoke with no owner credentials
        run: |
          python -m pip install -r scripts/requirements-browser.txt
          python -m playwright install --with-deps chromium
          python scripts/production_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-public-ui-${{ github.sha }}
          path: artifacts/production-public/
          if-no-files-found: warn
          retention-days: 14
