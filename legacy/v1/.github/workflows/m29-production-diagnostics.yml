name: Diagnose current existing Worker production HTTP responses
on:
  push:
    branches: [main]
    paths: [.github/workflows/m29-production-diagnostics.yml]
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect online PWA identity and strict headers without user credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error, time
          base='https://english-ii-plan.kopdabanya.workers.dev'
          for attempt in range(3):
            try:
              with urllib.request.urlopen(base+'/index.html',timeout=18) as r:
                html=r.read().decode('utf-8','replace')
                print('index.html:',r.status,'size:',len(html),'cloud script:', './cloud-sync.js' in html)
                h=r.headers
                csp=h.get('content-security-policy','')
                print('CSP header present:',bool(csp))
                print('CSP exact API origin present:',"connect-src 'self' https://124.70.128.201" in csp)
                print('Content type:',h.get('content-type'))
              break
            except Exception as e:
              print('index attempt',attempt+1,'failed:',type(e).__name__,'status:',getattr(e,'code',None))
              if isinstance(e,urllib.error.HTTPError):
                print('403 server:',e.headers.get('server'),'cf-ray:',bool(e.headers.get('cf-ray')),'content-type:',e.headers.get('content-type'))
                import re
                body=e.read(1000).decode('utf-8','replace')
                print('403 response class:', 'cloudflare' if 'cloudflare' in body.lower() else 'non-cloudflare', 'error code hints:',re.findall(r'(?i)(?:error|code)[^0-9]{0,8}([0-9]{3,5})',body)[:5])
              time.sleep(3)
          ua='Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Mobile Safari/537.36 EdgA/141.0.0.0'
          for suffix in ['/index.html','/cloud-sync.js','/server/banya-sync/app.py','/docs/ECS_HANDOFF.md','/AGENTS.md']:
            try:
              req=urllib.request.Request(base+suffix,headers={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,application/javascript,*/*;q=0.8'})
              with urllib.request.urlopen(req,timeout=18) as r:
                if suffix=='/index.html':
                  body=r.read().decode('utf-8','replace')
                  print('mobile Edge UA body includes sync script:', './cloud-sync.js' in body)
                  print('mobile Edge UA CSP allows verified ECS:', "connect-src 'self' https://124.70.128.201" in r.headers.get('content-security-policy',''))
                status=r.status
            except urllib.error.HTTPError as e: status=e.code
            except Exception as e:
              print(suffix,'error:',type(e).__name__)
              continue
            print(suffix,'status:',status)
          PY
