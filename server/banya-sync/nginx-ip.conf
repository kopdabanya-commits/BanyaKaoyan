server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 124.70.128.201;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 124.70.128.201;
    root /var/www/banya-pwa/current;
    ssl_certificate /etc/letsencrypt/live/124.70.128.201/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/124.70.128.201/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://124.70.128.201; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /health {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /v1/ai/ {
        access_log off;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
    }
    location ^~ /v1/ {
        access_log off;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 20s;
    }
    location = / { try_files /index.html =404; }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }
    location ~ ^/(?:index\.html|update\.html|refresh\.html|refresh\.js|styles\.css|app\.js|plan-import\.js|study-assistant\.js|cloud-sync\.js|origin-transfer\.js|planner-core\.js|plan-data\.js|plan\.json|study-intelligence\.js|study-ui\.js|politics-core\.js|politics-plan-data\.js|politics-plan\.json|politics-ui\.js|sw\.js|icons/icon-(?:192|512)\.png)$ {
        try_files $uri =404;
    }
    location / { return 404; }
}
