name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 后端依赖
        run: python -m pip install --quiet -r server/requirements.txt
      - name: 语法检查
        run: python -m py_compile server/main.py tests/smoke.py
      - name: 冒烟测试（假模型）
        run: python tests/smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 前端语法
        run: node --check assets/app.js && node --check sw.js
