name: 一次性调整今日英语二大作文

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/essay-once.yml'
      - 'deploy/ops_today_essay.py'

permissions:
  contents: read

jobs:
  update-today:
    if: >-
      github.event.head_commit.message == 'ops: execute one-time big-essay update' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 SSH 客户端
        run: python -m pip install "paramiko>=3.5,<5"
      - name: 备份并安全更新今日计划（只调用现有 /plan 接口）
        env:
          BANYA_ECS_PASSWORD: ${{ secrets.BANYA_ECS_PASSWORD }}
        run: python deploy/ops_today_essay.py
