name: Publish the single existing Banya PWA after main CI
on:
  push:
    branches: [main]
    paths:
      - index.html
      - styles.css
      - app.js
      - cloud-sync.js
      - origin-transfer.js
      - sw.js
      - manifest.webmanifest
      - _headers
      - .assetsignore
      - wrangler.jsonc
      - plan.json
      - plan-data.js
      - politics-plan.json
      - politics-plan-data.js
      - politics-core.js
      - politics-ui.js
      - planner-core.js
      - study-ui.js
      - icons/**
      - study-intelligence.js
      - scripts/**
      - .github/workflows/publish-existing-worker.yml
      - server/banya-sync/nginx-ip.conf
      - server/banya-sync/install-pwa-fallback.sh
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: banya-existing-worker-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All Node syntax, plans, offline, and both-subject tests
        run: |
          set -euo pipefail
          for f in app.js cloud-sync.js origin-transfer.js planner-core.js politics-core.js politics-ui.js sw.js; do node --check "$f"; done
          node scripts/check.mjs
          node scripts/sync-plan-mirrors.mjs --check
          node scripts/privacy-check.mjs
          node --test scripts/test.mjs scripts/sw-test.mjs scripts/access-test.mjs scripts/intelligence-test.mjs scripts/daily-feel-test.mjs scripts/politics-test.mjs scripts/integration-contract-test.mjs scripts/cloud-sync-test.mjs scripts/origin-transfer-test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run server regression tests (without access to production database)
        run: |
          python -m pip install -r server/banya-sync/requirements.txt pytest==9.0.2 httpx==0.28.1
          python -m pytest -q server/banya-sync/test_app.py server/banya-sync/test_backup_db.py
      - name: Verify intended existing Worker identity and public allowlist
        run: |
          set -euo pipefail
          test "$(node -p "JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')).name")" = 'english-ii-plan'
          grep -Fxq '*' .assetsignore
          grep -Fxq 'server/' .assetsignore
          grep -Fq "connect-src 'self' https://124.70.128.201;" _headers
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/banya-verification
  publish:
    needs: verify
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 5252fd1b762803460b0f452f8d7f128c
      BANYA_PWA_URL: https://english-ii-plan.kopdabanya.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish to the existing english-ii-plan Worker, never create another app
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4 deploy
      - name: Check published PWA identity, CSP and private-file exclusion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error, time
          base='https://english-ii-plan.kopdabanya.workers.dev'
          ua='Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Mobile Safari/537.36 EdgA/141.0.0.0'
          def get(path):
              request=urllib.request.Request(base+path,headers={'User-Agent':ua,'Accept':'text/html,application/javascript,*/*'})
              try:
                  with urllib.request.urlopen(request,timeout=20) as r:
                      return r.status,r.read(),r.headers
              except urllib.error.HTTPError as e:
                  if e.code==1010 or e.code==403:
                      raise RuntimeError('Cloudflare upstream rejected verification client; Edge real-device remains unverified')
                  return e.code,b'',e.headers
          for attempt in range(4):
              try:
                  status,html,headers=get('/index.html')
                  assert status==200 and b'./cloud-sync.js' in html,'PWA entrypoint missing'
                  csp=headers.get('content-security-policy','')
                  assert "connect-src 'self' https://124.70.128.201;" in csp,'ECS HTTPS CSP policy missing'
                  assert 'https://*' not in csp,'CSP wildcard forbidden'
                  break
              except Exception:
                  if attempt==3:raise
                  time.sleep(3)
          status,script,_=get('/cloud-sync.js')
          assert status==200 and b'banya_cloud_sync_config_v1' in script,'cloud sync asset unavailable'
          for suffix in ('/server/banya-sync/app.py','/docs/ECS_HANDOFF.md','/AGENTS.md'):
              status,_,_=get(suffix)
              assert status==404,(suffix,status)
          print('Verified real production Edge-UA requests: PWA HTML=200, sync script=200, exact CSP, private source/docs=404.')
          print('Android Edge actual-device learning data has not been accessed or changed by this test.')
          PY
  fallback:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    env:
      BANYA_SSH_PASSWORD: ${{ secrets.BANYA_ECS_SSH_PASSWORD }}
      BANYA_SSH_USER: ${{ vars.BANYA_ECS_SSH_USER || 'root' }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload only allowlisted PWA assets and verified Nginx config
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BANYA_SSH_PASSWORD"
          test -s server/banya-sync/known_hosts
          bash -n server/banya-sync/install-pwa-fallback.sh
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass
          tar -czf /tmp/banya-site.tgz index.html styles.css app.js cloud-sync.js origin-transfer.js \
            planner-core.js plan-data.js plan.json study-intelligence.js study-ui.js \
            politics-core.js politics-plan-data.js politics-plan.json politics-ui.js \
            sw.js manifest.webmanifest icons/icon-192.png icons/icon-512.png
          export SSHPASS="$BANYA_SSH_PASSWORD"
          sshpass -e ssh -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/server/banya-sync/known_hosts" \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15 \
            "$BANYA_SSH_USER@124.70.128.201" 'mkdir -p /root/banya-pwa-stage && chmod 700 /root/banya-pwa-stage'
          sshpass -e scp -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/server/banya-sync/known_hosts" \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 \
            /tmp/banya-site.tgz server/banya-sync/nginx-ip.conf \
            server/banya-sync/install-pwa-fallback.sh \
            "$BANYA_SSH_USER@124.70.128.201:/root/banya-pwa-stage/"
          sshpass -e ssh -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$GITHUB_WORKSPACE/server/banya-sync/known_hosts" \
            -o PreferredAuthentications=password -o PubkeyAuthentication=no \
            -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15 \
            "$BANYA_SSH_USER@124.70.128.201" \
            "mv /root/banya-pwa-stage/banya-site.tgz /root/banya-pwa-stage/site.tgz && bash /root/banya-pwa-stage/install-pwa-fallback.sh $GITHUB_SHA"
      - name: Verify public IP TLS, PWA assets and protected API
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request, urllib.error
          base='https://124.70.128.201'
          for path in ('index.html','sw.js','app.js','origin-transfer.js','icons/icon-192.png','manifest.webmanifest'):
              with urllib.request.urlopen(base+'/'+path, timeout=20) as response:
                  assert response.status==200,(path,response.status)
                  remote=response.read()
              assert hashlib.sha256(remote).digest()==hashlib.sha256(pathlib.Path(path).read_bytes()).digest(),path
          with urllib.request.urlopen(base+'/health',timeout=20) as response:
              assert response.status==200 and b'banya-study-sync' in response.read(256)
          for path,expected in (('/v1/snapshot/english',401),('/v1/snapshot/politics',401),('/server/banya-sync/app.py',404),('/docs/PROJECT_STATUS.md',404)):
              try: urllib.request.urlopen(base+path,timeout=20)
              except urllib.error.HTTPError as error: assert error.code==expected,(path,error.code)
              else: raise AssertionError(path+' unexpectedly public')
          print('Verified existing ECS IP HTTPS: exact PWA files, API health, unauthenticated 401, private paths 404.')
          PY
