name: Publish study archive
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'assets/icon.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: banya-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable Pages when permitted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow || echo 'Pages activation may require Settings > Pages > GitHub Actions.'
          fi
      - name: Validate archive before publishing
        run: |
          python - <<'PY'
          import json, pathlib, re
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          published = json.loads(pathlib.Path("data/progress.json").read_text(encoding="utf-8"))
          seed = re.search(r'<script type="application/json" id="seed-data">([\s\S]*?)</script>', html)
          assert seed, "Missing offline archive seed"
          assert json.loads(seed.group(1)) == published, "Offline archive differs from published progress"
          assert published["schema"] == 2 and isinstance(published["items"], dict)
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          assert len(scripts) == 1, "Expected exactly one application script"
          assert "function home()" in scripts[0] and "function yearDetail(y)" in scripts[0]
          pathlib.Path("/tmp/banya-archive.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/banya-archive.js
          node --check sw.js
      - uses: actions/configure-pages@v5
      - name: Package only current website
        run: |
          mkdir -p _site/assets _site/data
          cp index.html sw.js manifest.webmanifest _site/
          cp assets/icon.svg _site/assets/
          cp data/progress.json _site/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
