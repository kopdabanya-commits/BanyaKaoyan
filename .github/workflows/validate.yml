name: Validate planner
on: [push, pull_request]
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check planner-core.js
      - run: node --check app.js
      - run: node --check study-intelligence.js
      - run: node --check plan-data.js
      - run: node --check politics-core.js
      - run: node --check politics-plan-data.js
      - run: node --check politics-ui.js
      - run: node --check sw.js
      - run: node scripts/check.mjs

      - run: node --test scripts/test.mjs scripts/sw-test.mjs scripts/access-test.mjs scripts/intelligence-test.mjs scripts/daily-feel-test.mjs scripts/politics-test.mjs scripts/integration-contract-test.mjs
      - run: bash -n server/banya-sync/install-ecs.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/banya-sync/requirements.txt pytest==9.0.2 httpx==0.28.1
      - run: python -m pytest -q server/banya-sync/test_app.py
