name: Validate planner
# Run once for a PR, then once on merged main; avoid duplicate branch-push runs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check planner-core.js
      - run: node --check app.js
      - run: node --check study-intelligence.js
      - run: node --check plan-data.js
      - run: node --check politics-core.js
      - run: node --check politics-plan-data.js
      - run: node --check politics-ui.js
      - run: node --check sw.js
      - run: node --check origin-transfer.js
      - run: node scripts/check.mjs
      - run: node scripts/sync-plan-mirrors.mjs --check
      - run: node scripts/privacy-check.mjs

      - run: node --test scripts/test.mjs scripts/sw-test.mjs scripts/access-test.mjs scripts/intelligence-test.mjs scripts/daily-feel-test.mjs scripts/politics-test.mjs scripts/integration-contract-test.mjs scripts/cloud-sync-test.mjs scripts/origin-transfer-test.mjs
      - run: node --check cloud-sync.js
      - run: bash -n server/banya-sync/install-ecs.sh
      - run: bash -n server/banya-sync/install-pwa-fallback.sh
      - run: bash -n server/banya-sync/upgrade-private-plan.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/banya-sync/requirements.txt pytest==9.0.2 httpx==0.28.1
      - run: python -m pytest -q server/banya-sync/test_app.py server/banya-sync/test_backup_db.py server/banya-sync/test_agent_api.py
