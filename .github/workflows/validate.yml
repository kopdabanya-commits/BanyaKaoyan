name: Validate planner
on: [push, pull_request]
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check planner-core.js
      - run: node --check app.js
      - run: node --check study-intelligence.js
      - run: node --check plan-data.js
      - run: node --check sw.js
      - run: node scripts/check.mjs

      - run: node --test scripts/test.mjs scripts/sw-test.mjs scripts/access-test.mjs scripts/intelligence-test.mjs
