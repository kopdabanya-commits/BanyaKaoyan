name: Validate planner
on:
  pull_request:
    paths: ['**.js', '**.mjs', '**.py', '**.sh', '**.json', '**.webmanifest', '**.html', '**.css', 'icons/**', 'server/**', 'scripts/**', '.github/workflows/**', 'AGENTS.md']
  push:
    branches: [main]
    paths: ['**.js', '**.mjs', '**.py', '**.sh', '**.json', '**.webmanifest', '**.html', '**.css', 'icons/**', 'server/**', 'scripts/**', '.github/workflows/**', 'AGENTS.md']
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/banya-sync/requirements.txt
      - run: python -m pip install -r server/banya-sync/requirements.txt pytest==9.0.2 httpx==0.28.1
      - run: bash scripts/validate.sh
