name: Configure private Cloudflare access
on:
  workflow_dispatch:
    inputs:
      owner_email:
        description: '你的Cloudflare账户邮箱（唯一允许访问App的邮箱）'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: configure-private-cloudflare-access
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/main' && github.repository == 'kopdabanya-commits/English-II-Plan'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify automation before using secret
        run: node --test scripts/access-test.mjs
      - name: Configure exact email protection and verify before keeping domain open
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5252fd1b762803460b0f452f8d7f128c
          ACCESS_EMAIL: ${{ inputs.owner_email }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/configure-access.mjs
