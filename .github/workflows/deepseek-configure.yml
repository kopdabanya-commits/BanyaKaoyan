name: Reviewed DeepSeek configuration (no model call)
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [install-disabled, prepare-enabled]
        default: install-disabled
        description: Install disabled, or prepare limits for separate App approval
      monthly_budget_usd:
        type: string
        default: '0'
        description: Explicit application ceiling; recommended future initial value 2
      monthly_calls:
        type: string
        default: '0'
        description: Explicit application ceiling; recommended future initial value 40
permissions:
  contents: read
concurrency:
  group: banya-ecs-production
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    environment: banya-ai-production
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.BANYA_ECS_SSH_PASSWORD }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SSH_USER: ${{ vars.BANYA_ECS_SSH_USER || 'root' }}
      OPERATION: ${{ inputs.operation }}
      BUDGET: ${{ inputs.monthly_budget_usd }}
      CALLS: ${{ inputs.monthly_calls }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate non-secret parameters and protected configuration scripts
        run: |
          set -euo pipefail
          [[ "$OPERATION" == install-disabled || "$OPERATION" == prepare-enabled ]]
          [[ "$BUDGET" =~ ^[0-9]{1,3}(\.[0-9]{1,2})?$ && "$CALLS" =~ ^[0-9]{1,2}$ ]]
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$SSHPASS"
          test -n "$DEEPSEEK_API_KEY"
          bash -n server/banya-sync/configure-ai.sh
          python3 -m py_compile server/banya-sync/configure_ai.py
      - name: Install reviewed configuration over pinned SSH without model requests
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass
          opts=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/server/banya-sync/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15)
          remote="$SSH_USER@124.70.128.201"
          sshpass -e ssh "${opts[@]}" "$remote" 'install -d -m 0700 /root/banya-ai-stage'
          tar -C server/banya-sync -cf - configure_ai.py configure-ai.sh |
            sshpass -e ssh "${opts[@]}" "$remote" 'tar -C /root/banya-ai-stage -xf -'
          printf '%s' "$DEEPSEEK_API_KEY" |
            sshpass -e ssh "${opts[@]}" "$remote" "bash /root/banya-ai-stage/configure-ai.sh '$OPERATION' '$BUDGET' '$CALLS'"
