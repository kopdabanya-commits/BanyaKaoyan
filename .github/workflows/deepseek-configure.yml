name: Reviewed DeepSeek configuration and authorized verification
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [install-disabled, prepare-enabled, diagnose-readonly]
        default: install-disabled
        description: Install/prepare settings, or diagnose the existing server without changing configuration
      monthly_budget:
        type: string
        default: '0'
        description: Explicit application ceiling in selected currency
      monthly_calls:
        type: string
        default: '0'
        description: Positive monthly call cap or unlimited; budget always enforced
      currency:
        type: choice
        options: [CNY, USD]
        default: CNY
        description: Native account billing currency
      verify_chat:
        type: boolean
        default: false
        description: Separately authorized single paid read-only chat check; keeps existing configuration and grants
      verify_real:
        type: boolean
        default: false
        description: Separately authorized paid verification; never commits plans
permissions:
  contents: read
concurrency:
  group: banya-ecs-production
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    environment: banya-ai-production
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.BANYA_ECS_SSH_PASSWORD }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      SSH_USER: ${{ vars.BANYA_ECS_SSH_USER || 'root' }}
      OPERATION: ${{ inputs.operation }}
      BUDGET: ${{ inputs.monthly_budget }}
      CALLS: ${{ inputs.monthly_calls }}
      CURRENCY: ${{ inputs.currency }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate non-secret parameters and protected configuration scripts
        run: |
          set -euo pipefail
          [[ "$OPERATION" == install-disabled || "$OPERATION" == prepare-enabled || "$OPERATION" == diagnose-readonly ]]
          [[ "$BUDGET" =~ ^[0-9]{1,3}(\.[0-9]{1,2})?$ && ( "$CALLS" =~ ^[0-9]{1,4}$ || "$CALLS" == unlimited ) ]]
          [[ "$CURRENCY" == CNY || "$CURRENCY" == USD ]]
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -n "$SSHPASS"
          if [[ "$OPERATION" != diagnose-readonly ]]; then test -n "$DEEPSEEK_API_KEY"; fi
          bash -n server/banya-sync/configure-ai.sh
          python3 -m py_compile server/banya-sync/configure_ai.py
      - name: Install reviewed configuration over pinned SSH without model requests
        if: inputs.operation != 'diagnose-readonly'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass
          opts=(-o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/server/banya-sync/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15)
          remote="$SSH_USER@124.70.128.201"
          sshpass -e ssh "${opts[@]}" "$remote" 'install -d -m 0700 /root/banya-ai-stage'
          tar -C server/banya-sync -cf - configure_ai.py configure-ai.sh |
            sshpass -e ssh "${opts[@]}" "$remote" 'tar -C /root/banya-ai-stage -xf -'
          printf '%s' "$DEEPSEEK_API_KEY" |
            sshpass -e ssh "${opts[@]}" "$remote" "bash /root/banya-ai-stage/configure-ai.sh '$OPERATION' '$BUDGET' '$CALLS' '$CURRENCY'"
      - name: Explicitly authorized real preview-only verification
        if: inputs.verify_real && inputs.operation == 'prepare-enabled'
        env:
          BANYA_OWNER_TOKEN: ${{ secrets.BANYA_SYNC_TOKEN }}
        run: |
          test -n "$BANYA_OWNER_TOKEN"
          python3 scripts/verify_real_ai.py
      - name: Read-only runtime and official account diagnostics
        if: inputs.operation == 'diagnose-readonly'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass
          sshpass -e ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/server/banya-sync/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15 "$SSH_USER@124.70.128.201" 'python3 -' < scripts/ai_runtime_diagnostics.py | tee /tmp/banya-ai-diagnostics.json
      - name: Explicitly authorized single real chat check without configuration changes
        if: inputs.operation == 'diagnose-readonly' && inputs.verify_chat
        env:
          BANYA_OWNER_TOKEN: ${{ secrets.BANYA_SYNC_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          with open('/tmp/banya-ai-diagnostics.json') as f: report=json.load(f)
          assert report.get('balanceHttpStatus')==200 and report.get('accountAvailable') and report.get('positiveBalance'), 'Official account not ready; no paid request made'
          PY
          python3 scripts/verify_one_chat.py
