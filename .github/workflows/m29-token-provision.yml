name: Provision user-owned ECS sync token once
on:
  push:
    branches: [feat/huawei-ecs-cloud-sync-m29]
    paths: [.github/workflows/m29-token-provision.yml]
permissions:
  contents: read
concurrency:
  group: banya-ecs-token-provision
  cancel-in-progress: false
jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      BANYA_SYNC_TOKEN: ${{ secrets.BANYA_SYNC_TOKEN }}
      BANYA_SSH_PASSWORD: ${{ secrets.BANYA_ECS_SSH_PASSWORD }}
      BANYA_SSH_USER: ${{ vars.BANYA_ECS_SSH_USER || 'root' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate credentials and SSH host pin without outputting values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BANYA_SSH_PASSWORD"
          test "${#BANYA_SYNC_TOKEN}" -ge 32
          test -s server/banya-sync/known_hosts
          bash -n server/banya-sync/rotate-token.sh
          echo "::add-mask::$BANYA_SYNC_TOKEN"
          echo 'Required ECS SSH and user-held long-term sync secrets are both configured.' >> "$GITHUB_STEP_SUMMARY"
      - name: Securely provision only SHA-256 digest through pinned SSH
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sshpass
          export SSHPASS="$BANYA_SSH_PASSWORD"
          sshopts=(-p 22 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/server/banya-sync/known_hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=15)
          remote="$BANYA_SSH_USER@124.70.128.201"
          sshpass -e ssh "${sshopts[@]}" "$remote" 'install -d -m 0700 /root/banya-stage'
          sshpass -e ssh "${sshopts[@]}" "$remote" 'umask 077; cat > /root/banya-stage/rotate-token.sh; chmod 0700 /root/banya-stage/rotate-token.sh' < server/banya-sync/rotate-token.sh
          token_digest="$(printf '%s' "$BANYA_SYNC_TOKEN" | sha256sum | cut -d ' ' -f1)"
          printf '%s\n' "$token_digest" | sshpass -e ssh "${sshopts[@]}" "$remote" 'bash /root/banya-stage/rotate-token.sh'
          unset token_digest
      - name: Verify authorized public HTTPS GET and strict CORS without exposing data
        shell: bash
        run: |
          set -euo pipefail
          for subject in english politics; do
            status="$(curl --noproxy '*' -sS -o /tmp/banya-${subject}.json -w '%{http_code}' --max-time 12 \
              -H "Authorization: Bearer $BANYA_SYNC_TOKEN" "https://124.70.128.201/v1/snapshot/$subject")"
            test "$status" = 200
            python3 - "$subject" "/tmp/banya-${subject}.json" <<'PY'
          import json,sys
          subject,path=sys.argv[1:]
          obj=json.load(open(path))
          assert obj['subject']==subject and obj['revision']==0 and obj['state'] is None
          print('HTTPS authenticated',subject,'read: valid, empty initial revision=0')
          PY
            rm -f "/tmp/banya-${subject}.json"
          done
          status="$(curl --noproxy '*' -sS -o /dev/null -w '%{http_code}' --max-time 10 -H 'Authorization: Bearer invalid-dummy-value' https://124.70.128.201/v1/snapshot/english)"
          test "$status" = 401
          origin="https://english-ii-plan.kopdabanya.workers.dev"
          curl --noproxy '*' -fsS -D /tmp/banya-cors-headers -o /dev/null --max-time 12 \
            -X OPTIONS -H "Origin: $origin" -H 'Access-Control-Request-Method: PUT' \
            -H 'Access-Control-Request-Headers: authorization,content-type' \
            https://124.70.128.201/v1/snapshot/english
          grep -Fi "access-control-allow-origin: $origin" /tmp/banya-cors-headers >/dev/null
          echo 'HTTPS authentication, unauthorized rejection, and exact PWA CORS preflight: PASS'
