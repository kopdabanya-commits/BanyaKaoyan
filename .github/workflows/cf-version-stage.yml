name: Validate Cloudflare upload without changing production traffic
on:
  push:
    branches: [feat/huawei-ecs-cloud-sync-m29]
    paths: [.github/workflows/cf-version-stage.yml]
permissions:
  contents: read
jobs:
  stage-existing-worker-version:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 5252fd1b762803460b0f452f8d7f128c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker identity and zero backend exposure
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$(node -p "JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')).name")" = 'english-ii-plan'
          grep -Fxq 'server/' .assetsignore
          grep -Fq "connect-src 'self' https://124.70.128.201;" _headers
          node --check cloud-sync.js
      - name: Upload a non-active version of the existing Worker only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 versions upload
          echo 'Only a new non-active Worker version was uploaded. This job did not promote it to production.' >> "$GITHUB_STEP_SUMMARY"
