name: One-time authorized Banya ECS release handoff
# Owner explicitly authorized production release on 2026-10-19; preserve existing deployment checks.
on:
  push:
    branches: [main]
    paths: [.github/workflows/once-ecs-release.yml]
permissions:
  contents: read
  actions: write
jobs:
  reviewed-release-handoff:
    if: github.repository == 'kopdabanya-commits/BanyaKaoyan'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reviewed CNY patch belongs to current release
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6b8b6319e38f5b4263f28577bd736d8ee74ef8a7 "$GITHUB_SHA"
      - name: Dispatch reviewed ECS PWA release, then backend upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          dispatch_and_wait() {
            local workflow="$1"
            local baseline="" id="" tries=0
            baseline="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=workflow_dispatch&branch=main&per_page=10" | jq -r '[.workflow_runs[].id] | max // 0')"
            echo "Dispatching existing reviewed workflow: $workflow"
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" -f ref=main
            while (( tries < 60 )); do
              id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=workflow_dispatch&branch=main&per_page=15" | jq -r --argjson baseline "$baseline" --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.id > $baseline and .head_sha == $sha)] | .[0].id // 0')"
              [[ "$id" != "0" ]] && break
              tries=$((tries+1))
              sleep 5
            done
            [[ "$id" != "0" ]] || { echo "No matching release run appeared; stop safely"; exit 1; }
            echo "Waiting for run $id to finish before the next step"
            gh run watch "$id" --repo "$GITHUB_REPOSITORY" --exit-status
          }
          dispatch_and_wait ecs-release.yml
          dispatch_and_wait private-plan-release.yml
          echo "Both reviewed ECS workflows succeeded. No paid API or automatic planning was enabled."
