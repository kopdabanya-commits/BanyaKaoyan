<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<title>板牙考研</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./assets/style.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="mark">板</span><div><b>板牙考研</b><small id="subject-label">英语二</small></div></div>
    <div class="switcher" role="tablist">
      <button data-subject="english" class="on">英语二</button>
      <button data-subject="politics">政治</button>
    </div>
  </header>
  <main id="app"></main>
  <form id="command" class="command" autocomplete="off">
    <input id="command-input" maxlength="200" enterkeyhint="send" placeholder="说一句：明天没空 / 今天只有 90 分钟">
    <button type="submit" aria-label="发送">改</button>
  </form>
  <nav class="tabs">
    <button data-view="today" class="on"><i>今</i><span>今天</span></button>
    <button data-view="calendar"><i>历</i><span>日历</span></button>
    <button data-view="stats"><i>统</i><span>统计</span></button>
    <button data-view="me"><i>我</i><span>我的</span></button>
  </nav>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="./assets/app.js"></script>
</body>
</html>
