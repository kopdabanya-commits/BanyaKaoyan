function record(t,y,p,tx){return state.items[makeKey(t,y,p,tx)]}
function done(t,y,p,tx){return !!record(t,y,p,tx)}
function count(t){return Object.values(state.items).filter(v=>v.type===t).length}
function rcount(p){return Object.values(state.items).filter(v=>v.type==='reading'&&v.pass===p).length}
function scoreTxt(r){return r&&r.score!==null?`${r.score}/10`:'✓'}
function section(text,side=''){return `<div class="sectiontitle"><h2>${text}</h2>${side?`<small>${side}</small>`:''}</div>`}
function stat(label,num,unit,foot){return `<div class="stat"><div class="statlabel">${label}</div><div class="statval">${num}<span>${unit}</span></div><div class="statfoot">${foot}</div></div>`}
function firstUnconfirmed(){for(const y of YEARS){for(let i=1;i<=4;i++)if(!done('reading',y,2,i))return `${y} 年 Text ${i}`;}return '暂无缺口'}
function progressLimit(){const rs=Object.values(state.items).filter(r=>r.type==='reading'&&r.pass===2);if(!rs.length)return '尚无二刷完成记录';rs.sort((a,b)=>b.year-a.year||b.text-a.text);let newest=rs[0];return `${newest.year} 年 Text ${newest.text}`}
function home(){let other=TYPES.reduce((sum,[t])=>sum+count(t),0);let completedYears=YEARS.filter(y=>Array.from({length:4},(_,i)=>done('reading',y,1,i+1)).some(Boolean));let yspan=completedYears.length?completedYears[0]+'—'+completedYears[completedYears.length-1]:'暂无记录';return `
  <p class="intro">做过什么，一眼看清。没有打卡任务，不会自动安排学习。</p>
  <div class="stats">${stat('阅读一刷',rcount(1), '篇',yspan)}${stat('阅读二刷',rcount(2),'篇','最新 '+progressLimit())}${stat('其他题型',other,'项','完形 · 写作等')}</div>
  ${section('阅读二刷进度')}<div class="card accent-left"><div class="line"><div><div class="label">已确认的最新篇目</div><div class="maintext" style="margin-top:6px">${escapeHTML(progressLimit())}</div></div><button class="text-btn" data-goto="english">查看详情 →</button></div><p class="hint" style="margin:10px 0 0">目前共有 <strong>${rcount(2)} 篇</strong>二刷记录；未登记的篇目不会被标记为完成。</p></div>
  ${section('逐年完成情况','点击年份查看 / 补录')}
  <div class="year-overview">${YEARS.map(y=>{let a=Array.from({length:4},(_,i)=>done('reading',y,1,i+1)).filter(Boolean).length,b=Array.from({length:4},(_,i)=>done('reading',y,2,i+1)).filter(Boolean).length,c=TYPES.filter(([t])=>done(t,y)).length;return `<button class="overview-year" data-year="${y}"><span class="ov-year-num">${y}</span><span class="ov-labels"><span class="ov-label">阅读一刷<span class="ov-val ${a?'isdone':''}">${a}/4</span></span><span class="ov-label">阅读二刷<span class="ov-val ${b?'isdone':''}">${b}/4</span></span><span class="ov-label">其他题型<span class="ov-val ${c?'isdone':''}">${c}/5</span></span></span><span class="ov-chevron">›</span></button>`}).join('')}</div>
  <div class="scrollbox home-table"><table class="matrix"><thead><tr><th>年份</th><th>阅读一刷</th><th>阅读二刷</th>${TYPES.map(t=>`<th>${t[1]}</th>`).join('')}</tr></thead><tbody>${YEARS.map(y=>{let a=Array.from({length:4},(_,i)=>done('reading',y,1,i+1)).filter(Boolean).length,b=Array.from({length:4},(_,i)=>done('reading',y,2,i+1)).filter(Boolean).length;return `<tr data-year="${y}"><td>${y}</td><td class="${a===4?'yes':a?'partial':'none'}">${a?a+'/4':'—'}</td><td class="${b===4?'yes':b?'partial':'none'}">${b?b+'/4':'—'}</td>${TYPES.map(([t])=>`<td class="${done(t,y)?'yes':'none'}">${done(t,y)?'✓':'—'}</td>`).join('')}</tr>`}).join('')}</tbody></table></div>
  <p class="footnote">已记录的年份与篇目以历史确认情况为准。「—」不代表没做，只代表没有记录。</p>
  ${section('政治进度')}<div class="card simple-card"><div><div class="maintext">${escapeHTML(state.politics.courseName)}</div><div class="hint">已确认 ${state.politics.courseDone} 集 · 题库可补充进度</div></div><button class="text-btn" data-goto="politics">查看 →</button></div>
  <div class="notice">此前已确认的记录已预置在网页中。以前排过但没有确认完成的学习任务，不会被自动计入。</div>`}
function readingCard(y,p){let n=Array.from({length:4},(_,i)=>done('reading',y,p,i+1)).filter(Boolean).length;return `<div class="yearcard"><div class="line"><span class="year">${y}</span><span class="yearmeta">${n}/4 篇</span></div><div class="blocks">${Array.from({length:4},(_,i)=>{let tx=i+1,r=record('reading',y,p,tx);return `<button class="block ${r?'done':''}" data-edit="${makeKey('reading',y,p,tx)}"><span>T${tx}</span><span class="tiny">${r?(r.score!==null?r.score+'/10':'已做'):'＋'}</span></button>`}).join('')}</div></div>`}
function yearDetail(y){return `${section(`${y} 年 · 完成记录`)}<button class="text-btn" data-back-year style="margin-bottom:12px">← 返回年份列表</button><p class="intro">阅读分篇查看，其他题型按年记录；点击方格可补录或编辑。</p><div class="yearlist">${readingCard(y,1)}${readingCard(y,2)}${readingCard(y,3)}</div>${section('其他题型')}<div class="card typecard"><div class="typegrid">${TYPES.map(([t,name])=>{let r=record(t,y);return `<button class="typecell ${r?'done':''}" data-edit="${makeKey(t,y)}"><span>${name}</span><span class="value">${r?scoreTxt(r):'＋'}</span></button>`}).join('')}</div></div>`}
function english(){if(focusedYear!==null)return yearDetail(focusedYear);const readable=readMode==='other'?'其他题型':`阅读${readMode}刷`;const old=readMode==='other'?YEARS.filter(y=>TYPES.some(([t])=>done(t,y))):YEARS.filter(y=>Array.from({length:4},(_,i)=>done('reading',y,Number(readMode),i+1)).some(Boolean));const shown=showAll?YEARS:old;return `${section('英语二 · 完成记录')}<p class="intro">点击已完成的格子可查看得分、修改记录；点击「＋」补录。</p>
<div class="pills"><button class="pill ${readMode==='2'?'active':''}" data-read="2">阅读二刷</button><button class="pill ${readMode==='1'?'active':''}" data-read="1">阅读一刷</button><button class="pill ${readMode==='3'?'active':''}" data-read="3">阅读三刷</button><button class="pill ${readMode==='other'?'active':''}" data-read="other">其他题型</button></div>
<div class="line" style="margin:0 2px 13px"><span class="hint">${readable} · ${readMode==='other'?TYPES.reduce((n,[t])=>n+count(t),0):rcount(Number(readMode))} 条完成记录</span><button class="linkbtn" id="allYears">${showAll?'只看有记录年份':'显示全部年份'}</button></div>
${readMode==='other'?`<div class="stack">${shown.map(y=>`<div class="card typecard" style="margin:0"><div class="line"><span class="year">${y}</span><span class="yearmeta">${TYPES.filter(([t])=>done(t,y)).length}/5 项</span></div><div class="typegrid">${TYPES.map(([t,name])=>{let r=record(t,y);return `<button class="typecell ${r?'done':''}" data-edit="${makeKey(t,y)}"><span>${name}</span><span class="value">${r?scoreTxt(r):'＋'}</span></button>`}).join('')}</div></div>`).join('')}</div>`:`<div class="yearlist">${shown.map(y=>readingCard(y,Number(readMode))).join('')}</div>`}
${shown.length?'':`<div class="empty">这里还没有记录。点击右上角「＋ 补录」添加已做内容。</div>`}
<p class="footnote">2005—2009 年的早期阅读练习也做过一刷，未混入 2010 年起的英语二统计。未记录得分不代表零分。</p>`}
function politics(){return `${section('政治 · 进度记录')}<p class="intro">只写已经看过、刷过的内容，不会生成任务安排。</p>
 <form id="politicsForm"><div class="card"><div class="line"><span class="maintext">强化课</span><span class="tag orange">手动记录</span></div><label class="fieldlabel" for="pName">课程名称</label><input id="pName" class="field" value="${escapeHTML(state.politics.courseName)}" /><label class="fieldlabel" for="pDone">已完成到第几集</label><input id="pDone" type="number" class="field" min="0" max="999" inputmode="numeric" value="${escapeHTML(state.politics.courseDone)}" /><label class="fieldlabel" for="pCourseNote">补充说明</label><textarea id="pCourseNote" class="field" rows="2">${escapeHTML(state.politics.courseNote)}</textarea></div>
 <div class="card"><div class="maintext">肖1000题</div><label class="fieldlabel" for="pBank">使用的题库</label><input id="pBank" class="field" value="${escapeHTML(state.politics.questionBank)}" /><label class="fieldlabel" for="pQ">已刷到哪里（章节、题号都可）</label><textarea id="pQ" class="field" rows="2" placeholder="如：马原第三章第20题">${escapeHTML(state.politics.questionProgress)}</textarea></div>
 <div class="card"><div class="maintext">背诵手册及其他</div><label class="fieldlabel" for="pManual">背诵手册进度</label><textarea id="pManual" class="field" rows="2">${escapeHTML(state.politics.manualProgress)}</textarea><label class="fieldlabel" for="pNote">其他已经完成的政治内容</label><textarea id="pNote" class="field" rows="2" placeholder="没有可以留空">${escapeHTML(state.politics.note)}</textarea></div><button class="btn filled full" type="submit">保存政治进度</button></form>
 <p class="footnote">初始政治资料以 2026 年 10 月最后能确认的记录为准；目前真实进度可能比这里更靠后，修改后本机会保存。</p>`}
function dataPage(){const n=Object.keys(state.items).length;return `${section('备份与恢复')}
<div class="save-hero"><h3>把学习进度存成文件</h3><p>已经有 <strong>${n}</strong> 条英语完成记录。网页会在本机自动保存，联网可接收已发布的记录；本机补录不会自动上传，清理数据或换手机前请备份。建议定期导出备份。</p><button class="btn filled backup-main" id="saveJSON">↓ 导出备份文件（JSON）</button><div class="backup-secondary"><button class="btn" id="loadJSON">↑ 导入备份</button><button class="btn" id="saveHTML">↓ 导出离线网页</button></div><div class="backup-advice">JSON：用于换手机、恢复和继续补录。<br>HTML：把此刻的所有学习记录打包进一个独立网页，打开就能查看。</div></div>
${section('当前数据')}<div class="card"><div class="line"><span class="maintext">离线学习档案</span><span class="tag green">无需服务器</span></div><div class="hint" style="margin-top:8px">${n} 条英语记录 · 政治进度独立保存</div><div class="statusbar"><span class="dot"></span>${storageOK?'本机自动保存正常':'自动保存不可用，补录后请导出文件'}</div></div>
${section('使用说明')}<div class="card"><div class="hint">手机上点击「导出备份文件」，会下载一个 .json 文件，通常在系统「下载」目录。需要恢复时，重新打开网页，进入「数据」→「导入备份」选择文件即可。支持导入本工具以前导出的 JSON 文件或完整 HTML 网页副本。</div></div>
<details class="danger-zone"><summary class="text-btn">更多操作与数据说明</summary><div style="margin-top:13px"><div class="notice">${escapeHTML(state.meta.baseline||'')}${state.meta.uncertain?'<div style="margin-top:5px">'+escapeHTML(state.meta.uncertain)+'</div>':''}</div><button class="btn danger full" id="resetData" style="margin-top:12px">恢复本文件的初始记录</button><p class="footnote">此操作会清除在当前浏览器中后续补录的修改，执行前请先备份。</p></div></details>
<p class="footnote">没有账号和服务器。联网时会获取已发布的进度更新，但不会上传手机本地记录。备份只保存在你选择的位置，勿分享含私人备注的文件。</p>`}
function render(){document.querySelectorAll('.tab').forEach(b=>{let a=b.dataset.tab===activeTab;b.classList.toggle('active',a);b.setAttribute('aria-selected',a?'true':'false')});$('content').innerHTML=({home,english,politics,data:dataPage})[activeTab]();$('statusText').textContent=storageOK?'本地保存 · 联网检查新记录 · 可离线使用':'离线运行 · 请用「导出完整网页副本」保存修改';}
function goto(tab){activeTab=tab;render();window.scrollTo({top:0,behavior:'smooth'})}
function openDialog(k){editingKey=k||null;let r=k?state.items[k]:null;$('dialogTitle').textContent=r?'编辑已完成记录':'补录已完成内容';const md=k?.match(/^en:(reading|cloze|newtype|translation|small|large):(\d{4})(?::([123]):([1-4]))?$/);$('fYear').value=String(md?md[2]:2013);$('fType').value=md?md[1]:'reading';$('fPass').value=md&&md[3]?md[3]:'2';$('fText').value=md&&md[4]?md[4]:'1';$('fScore').value=r&&r.score!==null?r.score:'';$('fMins').value=r&&r.minutes!==null?r.minutes:'';$('fDate').value=r?.date||'';$('fNote').value=r?.note||'';$('deleteRecord').classList.toggle('hidden',!r);toggleReadFields();$('overlay').hidden=false;document.body.style.overflow='hidden'}
function toggleReadFields(){$('readingFields').classList.toggle('hidden',$('fType').value!=='reading')}
function closeDialog(){$('overlay').hidden=true;document.body.style.overflow=''}
function download(name,body,type){let blob=new Blob([body],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function snapshot(){const c=document.documentElement.cloneNode(true);c.setAttribute('data-archive-id','snapshot-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8));c.querySelector('#seed-data').textContent=JSON.stringify(state).replace(/</g,String.fromCharCode(92)+'u003c');const overlay=c.querySelector('#overlay');overlay.setAttribute('hidden','');c.querySelector('body').style.overflow='';c.querySelector('#content').innerHTML='';c.querySelector('#importFile').value='';return '<!doctype html>\n'+c.outerHTML}
function dateSlug(){const d=new Date();return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`}
function exportHTML(){download('板牙考研-学习档案-'+dateSlug()+'.html',snapshot(),'text/html;charset=utf-8');toast('已开始下载完整网页，请在下载目录确认保存')}
function exportJSON(){download('板牙考研-进度备份-'+dateSlug()+'.json',JSON.stringify(state,null,2),'application/json;charset=utf-8');toast('已开始下载 JSON 备份，请在下载目录确认保存')}
for(let y=2005;y<=2026;y++){let o=document.createElement('option');o.value=y;o.textContent=y;$('fYear').append(o)}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>goto(b.dataset.tab)));
$('addBtn').addEventListener('click',()=>openDialog(null));$('quickBackup').addEventListener('click',exportJSON);$('closeDlg').addEventListener('click',closeDialog);$('cancelDlg').addEventListener('click',closeDialog);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});$('fType').addEventListener('change',toggleReadFields);
$('recordForm').addEventListener('submit',e=>{e.preventDefault();const t=$('fType').value,y=Number($('fYear').value),p=Number($('fPass').value),tx=Number($('fText').value),k=makeKey(t,y,p,tx);let sc=$('fScore').value.trim(),mins=$('fMins').value.trim();if(sc!==''&&(!Number.isFinite(Number(sc))||Number(sc)<0||Number(sc)>10)){toast('得分只能是 0—10');return}if(mins!==''&&(Number(mins)<1||Number(mins)>999)){toast('用时只能填 1—999 分钟');return}let val={type:t,year:y,done:true,score:sc===''?null:Number(sc),minutes:mins===''?null:Number(mins),date:$('fDate').value||null,note:$('fNote').value.trim().slice(0,1500)};if(t==='reading'){val.pass=p;val.text=tx}if(editingKey&&editingKey!==k)delete state.items[editingKey];state.items[k]=val;closeDialog();store()});
$('deleteRecord').addEventListener('click',()=>{if(!editingKey)return;if(!confirm('确定删除这条完成记录？'))return;delete state.items[editingKey];closeDialog();store()});
$('content').addEventListener('click',e=>{let target=e.target.closest('[data-edit], [data-goto], [data-read], [data-year], [data-back-year], #allYears, #saveHTML, #saveJSON, #loadJSON, #resetData');if(!target)return;if(target.dataset.edit){openDialog(target.dataset.edit)}else if(target.dataset.goto){goto(target.dataset.goto)}else if(target.dataset.read){focusedYear=null;readMode=target.dataset.read;showAll=false;render()}else if(target.dataset.year){focusedYear=Number(target.dataset.year);goto('english')}else if(target.hasAttribute('data-back-year')){focusedYear=null;readMode='2';showAll=false;render()}else if(target.id==='allYears'){showAll=!showAll;render()}else if(target.id==='saveHTML'){exportHTML()}else if(target.id==='saveJSON'){exportJSON()}else if(target.id==='loadJSON'){$('importFile').click()}else if(target.id==='resetData'){if(confirm('确定恢复最初整理的学习档案？这会覆盖当前补录的数据。建议先导出备份。')){state=validate(initial);store();toast('已恢复初始档案')}}});
$('content').addEventListener('submit',e=>{if(e.target.id!=='politicsForm')return;e.preventDefault();state.politics={courseName:$('pName').value.trim().slice(0,150),courseDone:Number($('pDone').value)||0,courseNote:$('pCourseNote').value.trim().slice(0,2000),questionBank:$('pBank').value.trim().slice(0,150),questionProgress:$('pQ').value.trim().slice(0,2000),manualProgress:$('pManual').value.trim().slice(0,2000),note:$('pNote').value.trim().slice(0,2000)};store()});
$('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('文件超过 10 MB');const raw=await file.text();let parsed;if(/^\s*<(?:!doctype|html)/i.test(raw)){const doc=new DOMParser().parseFromString(raw,'text/html');const seed=doc.getElementById('seed-data');if(!seed)throw Error('未找到离线档案数据');parsed=JSON.parse(seed.textContent)}else{parsed=JSON.parse(raw)}const imported=validate(parsed);if(!confirm('导入将替换本机当前进度，建议先备份。确定继续？'))return;state=imported;store();toast('已成功恢复备份')}catch(err){alert('无法导入：'+(err.message||'文件格式错误'))}finally{e.target.value=''}});
const CLOUD_BASE_KEY='banya-archive-published-base-v1';
let cloudChecking=false;
async function checkPublishedUpdates(){
  if(cloudChecking||location.protocol!=='https:')return;
  cloudChecking=true;
  try{
    const reply=await fetch('./data/progress.json?fresh='+Date.now(),{cache:'no-store'});
    if(!reply.ok)return;
    const published=validate(await reply.json());
    let last;
    try{const raw=localStorage.getItem(CLOUD_BASE_KEY);last=raw?validate(JSON.parse(raw)):validate(initial)}
    catch(_){last=validate(initial)}
    const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
    let changed=false;
    const keys=new Set([...Object.keys(last.items),...Object.keys(published.items)]);
    for(const key of keys){
      const before=last.items[key],after=published.items[key];
      if(!same(before,after)&&same(state.items[key],before)){
        if(after===undefined)delete state.items[key];else state.items[key]=after;
        changed=true;
      }
    }
    const pk=new Set([...Object.keys(last.politics),...Object.keys(published.politics)]);
    for(const key of pk){
      if(!same(last.politics[key],published.politics[key])&&same(state.politics[key],last.politics[key])){
        state.politics[key]=published.politics[key];changed=true;
      }
    }
    for(const key of Object.keys(published.meta)){
      if(!same(last.meta[key],published.meta[key])&&same(state.meta[key],last.meta[key])){
        state.meta[key]=published.meta[key];changed=true;
      }
    }
    try{localStorage.setItem(CLOUD_BASE_KEY,JSON.stringify(published));}catch(_){}
    if(changed){
      state.updatedAt=new Date().toISOString();
      try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(_){storageOK=false}
      render();toast('已获取新发布的学习进度');
    }
  }catch(_){}finally{cloudChecking=false}
}

render();
checkPublishedUpdates();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkPublishedUpdates()});
window.addEventListener('online',checkPublishedUpdates);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
