<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f9fb" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="考研英语二冲刺日程：从2026年10月15日开始，65天，每天约100分钟。" />
  
  
  <link rel="stylesheet" href="./styles.css"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png" type="image/png">
  <title>研途 · 英语二冲刺</title>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="logo"><span class="logo-mark">研</span><span>研途 <small>ENGLISH II · 2027</small></span></div><div class="top-date" id="system-date"></div></header>
    <main id="app" aria-live="polite"></main>
  </div>
  <nav class="bottom-nav" aria-label="主导航">
    <button data-view="today" class="nav-tab active"><span class="nav-icon">⌂</span><span>今日</span></button>
    <button data-view="calendar" class="nav-tab"><span class="nav-icon">▦</span><span>日历</span></button>
    <button data-view="stats" class="nav-tab"><span class="nav-icon">▥</span><span>进度</span></button>
    <button data-view="settings" class="nav-tab"><span class="nav-icon">⚙</span><span>设置</span></button>
  </nav>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="编辑任务"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="./planner-core.js"></script>
  <script src="./plan-data.js"></script>
  <script src="./app.js"></script>
</body>
</html>
