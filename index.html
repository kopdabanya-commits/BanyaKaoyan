<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f8f6">
<meta name="color-scheme" content="light">
<title>板牙考研 · 英语二真题进度</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
<style>
:root{--bg:#f5f8f6;--paper:#fff;--ink:#192c26;--muted:#677d74;--line:#e2eae5;--green:#247a62;--green-soft:#e2f3e9;--off:#eff2ef;--shadow:0 2px 12px #173a2510}
*{box-sizing:border-box}
html{min-width:0;-webkit-text-size-adjust:100%}
body{margin:0;min-width:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--green);outline-offset:3px}
button:disabled{opacity:.28;cursor:not-allowed}
.app{width:100%;max-width:610px;margin:0 auto;padding:18px 14px calc(36px + env(safe-area-inset-bottom));min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:20px}
.brandline{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:35px;height:35px;display:grid;place-items:center;flex:none;border-radius:11px;background:#204d3e;color:#fff;font-weight:800;font-size:17px}
.title{font-size:17px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.mini{font-size:11px;color:var(--muted);margin-top:1px}
.actions{display:flex;gap:7px;align-items:center;flex:none}
.small-btn{min-height:36px;border-radius:10px;border:1px solid var(--line);padding:0 11px;background:#fff;color:var(--ink);font-size:12px;font-weight:700}
.small-btn.main{background:var(--green);color:#fff;border-color:var(--green)}
.page-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.page-title h1{margin:0;font-size:21px;line-height:1.3;letter-spacing:-.5px}
.count{font-size:12px;color:var(--muted);white-space:nowrap}
.legend{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.65}
.matrix{width:100%;min-width:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow)}
.matrix-head,.matrix-row{display:grid;grid-template-columns:45px 52px 52px repeat(5,minmax(0,1fr));column-gap:2px;align-items:center;width:100%;min-width:0}
.matrix-head{height:36px;padding:0 9px;background:#edf3ef;border-bottom:1px solid var(--line);color:#647b70;font-size:11px;font-weight:750;text-align:center}
.matrix-head span{min-width:0;white-space:nowrap}
.matrix-head span:first-child{text-align:left}
.matrix-row{padding:0 9px;height:52px;border:0;border-bottom:1px solid #eaf0eb;background:#fff;text-align:center;color:var(--ink);border-radius:0}
.matrix-row:last-child{border-bottom:0}
.matrix-row:hover{background:#f8fbf9}.matrix-row:active{background:#edf6ef}
.matrix-row .yr{font-size:13px;font-weight:790;text-align:left;font-variant-numeric:tabular-nums}
.cel{display:flex;min-width:0;align-items:center;justify-content:center;height:31px}
.dots{display:flex;gap:3px;align-items:center;justify-content:center;min-width:0}
.dots i{display:block;width:7px;height:11px;border-radius:3px;background:#e4e9e5}
.dots i.yes{background:#31866c}
.flag{display:grid;place-items:center;height:26px;width:26px;border-radius:8px;background:#f2f4f2;color:#adb9b0;font-size:16px;font-weight:700}
.flag.yes{background:var(--green-soft);color:var(--green)}
.matrix-hint{font-size:11px;color:#8a9b91;margin:12px 3px 0;line-height:1.65}
.back{background:none;border:none;padding:7px 0;color:var(--green);font-weight:700;font-size:13px;min-height:37px}
.detail-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 18px}
.detail-top h1{font-size:27px;line-height:1.25;letter-spacing:-.6px;margin:0}
.year-nav{display:flex;gap:7px}
.year-nav button{border:1px solid var(--line);background:white;width:40px;height:40px;border-radius:10px;color:var(--ink);font-size:25px;line-height:1}
.detail-group{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:0 0 10px}
.group-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.group-head h2{font-size:14px;margin:0;font-weight:780}
.group-head small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.exercise-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.exercise{min-width:0;min-height:59px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;border:1px solid #e5eae6;border-radius:11px;background:#fafbf9;color:#8b9d93;padding:6px 3px}
.exercise b{font-size:13px;font-weight:730;color:inherit}
.exercise small{font-size:10px;font-weight:650}
.exercise.done{border-color:#c5e3d4;background:#eaf7ef;color:#26765d}
.exercise-grid.other{grid-template-columns:repeat(3,minmax(0,1fr))}
.exercise-grid.other .exercise{min-height:60px}
.extra-pass summary{cursor:pointer;padding:11px 4px;color:var(--green);font-size:13px;font-weight:750}
.note{font-size:12px;color:var(--muted);line-height:1.65;margin:10px 2px}
.data-card{background:#fff;padding:18px;border-radius:16px;border:1px solid var(--line);margin-bottom:12px}
.data-card h2{font-size:16px;margin:0 0 7px}
.data-card p{margin:0 0 14px;color:var(--muted);font-size:12px;line-height:1.7}
.data-stack{display:grid;gap:9px}
.btn{display:grid;place-items:center;border:1px solid var(--line);min-height:45px;padding:9px 13px;background:#fff;border-radius:11px;font-weight:750;color:var(--ink);font-size:13px}
.btn.main{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:#b4504e;border-color:#f1d6d4}
.btn.light{background:#fff}
.small-note{font-size:11px;color:var(--muted);line-height:1.7}
.overlay{position:fixed;inset:0;background:#0b231ca1;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.overlay[hidden]{display:none}
.sheet{width:100%;max-width:560px;max-height:94dvh;overflow:auto;overscroll-behavior:contain;background:#fff;border-radius:21px 21px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-top h2{font-size:17px;font-weight:790;margin:0}
.x{border:0;border-radius:9px;background:#edf2ee;width:35px;height:35px;font-size:20px;color:#576b5f}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;font-weight:700;color:#4b6558;margin:10px 0 5px}
.field{width:100%;min-width:0;min-height:43px;border:1px solid #dce5de;border-radius:10px;background:#fff;padding:10px 11px;font-size:16px;color:var(--ink)}
textarea.field{min-height:66px;resize:vertical}
#moreFields{margin:10px 0}
#moreFields summary{font-size:13px;color:var(--green);font-weight:750;cursor:pointer;padding:9px 0}
.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.form-actions .btn.main{grid-column:1/-1;grid-row:1}
.form-actions .btn{min-width:0}
.preview{font-size:13px;font-weight:720;padding:10px 12px;border-radius:11px;background:#edf7f0;color:#356d52}
.toast{position:fixed;z-index:40;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#243d31;color:#fff;display:flex;gap:14px;align-items:center;white-space:nowrap;max-width:95vw;border-radius:12px;box-shadow:0 8px 25px #0003;padding:11px 14px;font-size:12px}
.toast button{border:0;background:none;color:#bdf2cd;font-weight:800;padding:3px}
@media(min-width:760px){.app{padding:30px 22px 45px}.sheet{border-radius:21px;align-self:center;padding:25px}.overlay{padding:20px}}
@media(max-width:365px){
.app{padding:14px 9px calc(28px + env(safe-area-inset-bottom))}
.matrix-head,.matrix-row{grid-template-columns:43px 46px 46px repeat(5,minmax(0,1fr));column-gap:1px;padding-left:6px;padding-right:6px}
.matrix-head{font-size:10px}.matrix-row .yr{font-size:12px}.dots{gap:2px}.dots i{width:6px;height:10px}.flag{height:24px;width:23px;border-radius:7px}
.title{font-size:16px}.small-btn{padding:0 9px}.detail-group{padding:12px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

<div id="preview" class="preview"></div>
<div id="choices">
<div class="form-row"><div><label for="fYear">年份</label><select class="field" id="fYear"></select></div><div><label for="fType">题型</label><select class="field" id="fType"><option value="reading">阅读</option><option value="cloze">完形</option><option value="newtype">新题型</option><option value="translation">翻译</option><option value="small">小作文</option><option value="large">大作文</option></select></div></div>
<div class="form-row" id="readingChoices"><div><label for="fPass">第几刷</label><select class="field" id="fPass"><option value="1">一刷</option><option value="2">二刷</option><option value="3">三刷</option></select></div><div><label for="fText">文章</label><select class="field" id="fText"><option value="1">Text 1</option><option value="2">Text 2</option><option value="3">Text 3</option><option value="4">Text 4</option></select></div></div>
</div>
<details id="moreFields"><summary>分数、日期和备注（可不填）</summary>
<div class="form-row"><div><label for="fScore">得分 /10</label><input class="field" id="fScore" type="number" min="0" max="10" step="0.5" inputmode="decimal" placeholder="如 8.5"></div><div><label for="fMinutes">用时（分钟）</label><input class="field" id="fMinutes" type="number" min="1" max="999" inputmode="numeric" placeholder="选填"></div></div>
<label for="fDate">完成日期</label><input class="field" id="fDate" type="date">
<label for="fNote">备注</label><textarea class="field" id="fNote" rows="2" placeholder="选填"></textarea>
</details>
<div class="form-actions"><button class="btn danger" type="button" id="deleteBtn">删除记录</button><button class="btn light" type="button" id="cancelBtn">取消</button><button class="btn main" type="submit" id="submitBtn">标记已完成</button></div>
</form>
</section></div>
<input type="file" id="fileInput" accept=".json,.html,.htm,application/json,text/html" hidden>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var TYPES=[['cloze','完形'],['newtype','新题'],['translation','翻译'],['small','小作'],['large','大作']];
var YEARS=Array.from({length:16},function(_,i){return 2010+i});
var KEY='banya-offline-learning-archive-v2'+(document.documentElement.getAttribute('data-archive-id')?'-'+document.documentElement.getAttribute('data-archive-id'):'');
var CLOUD_KEY='banya-archive-published-base-v2';
var original=JSON.parse($('seed-data').textContent);
function keyFor(type,year,pass,text){return type==='reading'?'en:reading:'+year+':'+pass+':'+text:'en:'+type+':'+year}
function clone(x){return JSON.parse(JSON.stringify(x))}
function validate(src){
 if(!src||src.schema!==2||!src.items||typeof src.items!=='object'||Array.isArray(src.items))throw Error('不是有效的学习档案');
 var clean={schema:2,updatedAt:src.updatedAt||'',items:{},meta:Object.assign({},original.meta,src.meta||{})};
 Object.entries(src.items).forEach(function(entry){
  var k=entry[0],v=entry[1];if(!v||v.done!==true||!/^en:(reading|cloze|newtype|translation|small|large):\d{4}(?::[123]:[1-4])?$/.test(k))return;
  var y=Number(v.year),t=v.type,p=Number(v.pass),n=Number(v.text);
  if(y<2005||y>2026||!['reading','cloze','newtype','translation','small','large'].includes(t)||k!==keyFor(t,y,p,n))return;
  var sc=v.score==null||v.score===''?null:Number(v.score);
  if(sc!==null&&(!Number.isFinite(sc)||sc<0||sc>10))sc=null;
  var m=v.minutes==null||v.minutes===''?null:Number(v.minutes);
  if(!Number.isFinite(m)||m<1||m>999)m=null;
  clean.items[k]={type:t,year:y,done:true,score:sc,minutes:m,date:typeof v.date==='string'?v.date.slice(0,10):null,note:String(v.note||'').slice(0,1500)};
  if(t==='reading'){clean.items[k].pass=p;clean.items[k].text=n}
 });
 return clean;
}
var state,storageOK=true;
try{var saved=localStorage.getItem(KEY);state=saved?validate(JSON.parse(saved)):validate(original)}catch(_){state=validate(original);storageOK=false}
var page='list',selectedYear=2013,editingKey=null,toastTimer=null,undoAction=null,lastScroll=0,previousFocus=null,choiceMode=false;
function record(t,y,p,n){return state.items[keyFor(t,y,p,n)]}
function numRead(y,p){var n=0;for(var i=1;i<=4;i++)if(record('reading',y,p,i))n++;return n}
function numOther(y){return TYPES.filter(function(t){return !!record(t[0],y)}).length}
function scoreText(r){return r.score!==null?r.score+'/10':'已做'}
function count(){return Object.keys(state.items).length}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function dots(y,p){
 var out='<span class="cel dots" aria-label="'+y+'年阅读'+p+'刷已完成'+numRead(y,p)+'篇">';
 for(var i=1;i<=4;i++)out+='<i class="'+(record('reading',y,p,i)?'yes':'')+'"></i>';
 return out+'</span>';
}
function flag(t,y){
 return '<span class="cel"><span class="flag '+(record(t,y)?'yes':'')+'">'+(record(t,y)?'✓':'–')+'</span></span>';
}
function renderList(){
 var result='<div class="page-title"><h1>真题进度</h1><span class="count">'+count()+' 条已记录</span></div>';
 result+='<p class="legend">绿色已完成，灰色未记录。点击年份查看具体篇目并补录。</p>';
 result+='<div class="matrix" role="group" aria-label="英语二按年份、题型的完成进度">';
 result+='<div class="matrix-head"><span>年份</span><span>一刷</span><span>二刷</span><span>完形</span><span>新题</span><span>翻译</span><span>小作</span><span>大作</span></div>';
 YEARS.forEach(function(y){
  var label=y+'年，阅读一刷'+numRead(y,1)+'篇，阅读二刷'+numRead(y,2)+'篇，其他题型'+numOther(y)+'项，打开详情';
  result+='<button type="button" class="matrix-row" data-year="'+y+'" aria-label="'+label+'"><span class="yr">'+y+'</span>'+dots(y,1)+dots(y,2)+TYPES.map(function(t){return flag(t[0],y)}).join('')+'</button>';
 });
 result+='</div><p class="matrix-hint">一刷、二刷各有 4 个小格，对应 Text 1—4。灰色表示未确认做过，不等于一定没做。</p>';
 return result;
}
function exercise(t,y,p,n,title){
 var k=keyFor(t,y,p,n),r=state.items[k],caption=r?(r.score!==null?r.score+'/10':'✓ 已做'):'＋ 未做';
 return '<button type="button" class="exercise '+(r?'done':'')+'" data-key="'+k+'" aria-label="'+y+'年'+title+'：'+(r?'已完成':'未记录')+'"><b>'+title+'</b><small>'+caption+'</small></button>';
}
function readingGroup(y,p){
 var countNow=numRead(y,p),parts='';
 for(var i=1;i<=4;i++)parts+=exercise('reading',y,p,i,'Text '+i);
 return '<section class="detail-group"><div class="group-head"><h2>阅读 · '+p+'刷</h2><small>'+countNow+' / 4</small></div><div class="exercise-grid">'+parts+'</div></section>';
}
function renderYear(y){
 var s='<button type="button" class="back" id="backBtn">‹ 全部年份</button>';
 s+='<div class="detail-top"><h1>'+y+' 年真题</h1><div class="year-nav"><button data-neighbor="'+(y-1)+'" '+(y<=2010?'disabled':'')+' aria-label="上一年">‹</button><button data-neighbor="'+(y+1)+'" '+(y>=2025?'disabled':'')+' aria-label="下一年">›</button></div></div>';
 s+=readingGroup(y,1)+readingGroup(y,2);
 s+='<section class="detail-group"><div class="group-head"><h2>其他题型</h2><small>'+numOther(y)+' / 5</small></div><div class="exercise-grid other">';
 TYPES.forEach(function(t){var title={'cloze':'完形','newtype':'新题型','translation':'翻译','small':'小作文','large':'大作文'}[t[0]];s+=exercise(t[0],y,0,0,title)});
 s+='</div></section>';
 var three=numRead(y,3);
 s+='<details class="extra-pass" '+(three?'open':'')+'><summary>阅读三刷'+(three?' · '+three+'/4':'（如有）')+'</summary>'+readingGroup(y,3)+'</details>';
 s+='<p class="note">点「＋ 未做」直接标记完成；点绿色「已做」可编辑分数、备注或删除。</p>';
 return s;
}
function renderData(){
 return '<button class="back" id="backBtn">‹ 返回进度</button><div class="page-title"><h1>备份档案</h1></div>'+
 '<section class="data-card"><h2>保存当前记录</h2><p>当前共 '+count()+' 条。补录自动存到本机浏览器；换手机或清理浏览器前请导出备份。</p><div class="data-stack"><button class="btn main" id="saveJson">下载备份文件（JSON）</button><button class="btn" id="loadJson">导入备份文件</button><button class="btn" id="saveHtml">导出独立离线网页</button></div></section>'+
 '<p class="small-note">网页可离线打开。联网时可以获取 GitHub 上新发布的记录，本机修改不会自动上传。备份不要误分享。</p>';
}
function render(){
 $('view').innerHTML=page==='list'?renderList():page==='year'?renderYear(selectedYear):renderData();
 $('backupBtn').setAttribute('aria-current',page==='data'?'page':'false');
}
function view(next,y){
 if(page==='list')lastScroll=window.scrollY||0;
 page=next;if(typeof y==='number')selectedYear=y;
 try{history.pushState({banya:true,page:page,year:selectedYear},'',location.pathname+location.search+'#'+(page==='year'?'year-'+selectedYear:page))}catch(_){}
 render();window.scrollTo(0,0);
}
function goBack(){
 if(page==='list')return;
 page='list';
 try{history.pushState({banya:true,page:'list',year:selectedYear},'',location.pathname+location.search+'#list')}catch(_){}
 render();window.scrollTo(0,lastScroll);
}
window.addEventListener('popstate',function(e){
 if(!e.state||!e.state.banya){page='list'}else{page=e.state.page;selectedYear=e.state.year||2013}
 render();window.scrollTo(0,page==='list'?lastScroll:0);
});
function save(notify){
 state.updatedAt=new Date().toISOString();
 try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(_){storageOK=false}
 render();
 if(notify)toast(storageOK?'已保存':'存储受限，请导出备份');
}
function toast(message,undo){
 var old=document.querySelector('.toast');if(old)old.remove();
 if(toastTimer)clearTimeout(toastTimer);
 var box=document.createElement('div');box.className='toast';
 var span=document.createElement('span');span.textContent=message;box.appendChild(span);
 if(undo){var b=document.createElement('button');b.type='button';b.textContent='撤销';b.addEventListener('click',function(){box.remove();undo();});box.appendChild(b)}
 document.body.appendChild(box);toastTimer=setTimeout(function(){box.remove()},3500);
}
function parseKey(k){var m=k.match(/^en:(reading|cloze|newtype|translation|small|large):(\d{4})(?::([123]):([1-4]))?$/);return m?{type:m[1],year:Number(m[2]),pass:Number(m[3]||1),text:Number(m[4]||1)}:null}
function blank(t,y,p,n){var v={type:t,year:y,done:true,score:null,minutes:null,date:null,note:''};if(t==='reading'){v.pass=p;v.text=n}return v}
function quickDone(k){
 var x=parseKey(k);if(!x)return;
 if(state.items[k]){openEditor(k,false);return}
 state.items[k]=blank(x.type,x.year,x.pass,x.text);save(false);
 toast('已标记完成',function(){if(state.items[k]&&state.items[k].score===null&&state.items[k].note===''){delete state.items[k];save(false);toast('已撤销')}})
}
function setReading(){ $('readingChoices').style.display=$('fType').value==='reading'?'grid':'none'}
function openEditor(k,standalone){
 previousFocus=document.activeElement;choiceMode=!!standalone;editingKey=k||null;
 var x=parseKey(k||'')||{type:'reading',year:selectedYear,pass:2,text:1};
 var r=k?state.items[k]:null;
 $('dialogTitle').textContent=r?'编辑已完成记录':'补录已完成内容';
 $('choices').style.display=standalone?'block':'none';
 $('fYear').value=String(x.year);$('fType').value=x.type;$('fPass').value=String(x.pass);$('fText').value=String(x.text);
 $('preview').textContent=standalone?'选择已经做完的真题':x.year+' 年 · '+(x.type==='reading'?'阅读 '+x.pass+'刷 Text '+x.text:({'cloze':'完形','newtype':'新题型','translation':'翻译','small':'小作文','large':'大作文'}[x.type]));
 $('fScore').value=r&&r.score!==null?r.score:'';
 $('fMinutes').value=r&&r.minutes!==null?r.minutes:'';
 $('fDate').value=r&&r.date?r.date:'';
 $('fNote').value=r?r.note:'';
 $('moreFields').open=Boolean(r&&(r.score!==null||r.minutes!==null||r.date||r.note));
 $('deleteBtn').style.visibility=r?'visible':'hidden';
 $('submitBtn').textContent=r?'保存修改':'标记已完成';
 setReading();$('overlay').hidden=false;document.body.style.overflow='hidden';
}
function closeEditor(){
 $('overlay').hidden=true;document.body.style.overflow='';
 if(previousFocus&&previousFocus.isConnected)previousFocus.focus({preventScroll:true});
 previousFocus=null;
}
function download(name,body,type){
 var blob=new Blob([body],{type:type}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},30000);
}
function slug(){var x=new Date();return x.getFullYear()+String(x.getMonth()+1).padStart(2,'0')+String(x.getDate()).padStart(2,'0')}
function exportJson(){download('板牙考研-进度-'+slug()+'.json',JSON.stringify(state,null,2),'application/json;charset=utf-8');toast('已开始下载备份')}
function exportHtml(){
 var c=document.documentElement.cloneNode(true);
 c.setAttribute('data-archive-id','snapshot-'+Date.now().toString(36));
 c.querySelector('#seed-data').textContent=JSON.stringify(state).replace(/</g,'\\u003c');
 var overlay=c.querySelector('#overlay');overlay.setAttribute('hidden','');
 c.querySelector('#view').innerHTML='';
 download('板牙考研-离线档案-'+slug()+'.html','<!doctype html>\n'+c.outerHTML,'text/html;charset=utf-8');
 toast('已开始下载离线网页');
}
function applyImport(file){
 if(!file)return;
 if(file.size>10*1024*1024){toast('文件过大');return}
 file.text().then(function(raw){
  var value;
  if(/^\s*<(?:!doctype|html)/i.test(raw)){
   var doc=new DOMParser().parseFromString(raw,'text/html'),seed=doc.getElementById('seed-data');
   if(!seed)throw Error('未找到档案');
   value=JSON.parse(seed.textContent);
  }else value=JSON.parse(raw);
  var result=validate(value);
  if(!confirm('导入会替换本机目前的记录，确认导入？'))return;
  state=result;save(false);toast('备份已恢复');
 }).catch(function(err){alert('导入失败：'+(err.message||'格式错误'))}).finally(function(){$('fileInput').value=''});
}
for(var y=2005;y<=2026;y++){var opt=document.createElement('option');opt.value=y;opt.textContent=y;$('fYear').appendChild(opt)}
$('fType').addEventListener('change',setReading);
$('backupBtn').addEventListener('click',function(){view('data')});
$('addBtn').addEventListener('click',function(){openEditor(null,true)});
$('closeDialog').addEventListener('click',closeEditor);
$('cancelBtn').addEventListener('click',closeEditor);
$('overlay').addEventListener('click',function(e){if(e.target===$('overlay'))closeEditor()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('overlay').hidden)closeEditor()});
$('view').addEventListener('click',function(e){
 var t=e.target.closest('[data-year],[data-neighbor],[data-key],#backBtn,#saveJson,#loadJson,#saveHtml');
 if(!t)return;
 if(t.dataset.year){view('year',Number(t.dataset.year));return}
 if(t.dataset.neighbor){var v=Number(t.dataset.neighbor);if(v>=2010&&v<=2025)view('year',v);return}
 if(t.dataset.key){quickDone(t.dataset.key);return}
 if(t.id==='backBtn'){goBack();return}
 if(t.id==='saveJson'){exportJson();return}
 if(t.id==='loadJson'){$('fileInput').click();return}
 if(t.id==='saveHtml'){exportHtml();return}
});
$('form').addEventListener('submit',function(e){
 e.preventDefault();
 var x=choiceMode?{type:$('fType').value,year:Number($('fYear').value),pass:Number($('fPass').value),text:Number($('fText').value)}:parseKey(editingKey);
 if(!x)return;
 var k=keyFor(x.type,x.year,x.pass,x.text),sc=$('fScore').value.trim(),minutes=$('fMinutes').value.trim();
 if(sc!==''&&(!Number.isFinite(Number(sc))||Number(sc)<0||Number(sc)>10)){toast('分数应在 0—10 之间');return}
 if(minutes!==''&&(!Number.isInteger(Number(minutes))||Number(minutes)<1||Number(minutes)>999)){toast('用时应在 1—999 分钟');return}
 if(state.items[k]&&k!==editingKey&&!confirm('已有该题记录，确认覆盖？'))return;
 var value=blank(x.type,x.year,x.pass,x.text);
 value.score=sc===''?null:Number(sc);value.minutes=minutes===''?null:Number(minutes);value.date=$('fDate').value||null;value.note=$('fNote').value.slice(0,1500);
 if(editingKey&&editingKey!==k)delete state.items[editingKey];
 state.items[k]=value;closeEditor();save(true);
});
$('deleteBtn').addEventListener('click',function(){
 if(!editingKey||!state.items[editingKey])return;
 if(!confirm('确定删除这条完成记录？'))return;
 delete state.items[editingKey];closeEditor();save(true);
});
$('fileInput').addEventListener('change',function(e){applyImport(e.target.files&&e.target.files[0])});
async function publishedUpdate(){
 if(location.protocol!=='https:'||document.documentElement.hasAttribute('data-archive-id'))return;
 try{
  var response=await fetch('./data/progress.json?v='+Date.now(),{cache:'no-store'});
  if(!response.ok)return;
  var published=validate(await response.json()),base;
  try{var v=localStorage.getItem(CLOUD_KEY);base=v?validate(JSON.parse(v)):validate(original)}catch(_){base=validate(original)}
  var same=function(a,b){return JSON.stringify(a)===JSON.stringify(b)};
  var changed=false,keys=new Set(Object.keys(base.items).concat(Object.keys(published.items)));
  keys.forEach(function(k){
   var before=base.items[k],after=published.items[k];
   if(!same(before,after)&&same(state.items[k],before)){
    if(after===undefined)delete state.items[k];else state.items[k]=after;changed=true;
   }
  });
  try{localStorage.setItem(CLOUD_KEY,JSON.stringify(published))}catch(_){}
  if(changed){save(false);toast('已获取最新发布记录')}
 }catch(_){}
}
try{history.replaceState({banya:true,page:'list',year:selectedYear},'',location.href)}catch(_){}
render();publishedUpdate();
document.addEventListener('visibilitychange',function(){if(!document.hidden)publishedUpdate()});
window.addEventListener('online',publishedUpdate);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(function(){});
})();
</script>
</body>
</html>
